[package]
name = "greenlight"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
description = "Open-source xCloud and Xbox home streaming client written in Rust, using GStreamer webrtcbin"
license = "MIT"
readme = "README.md"
keywords = ["xbox", "xcloud", "streaming", "webrtc", "gstreamer"]
categories = ["games", "multimedia"]

[features]
default = ["gamepad", "gui"]
# Physical gamepad support (and rumble) through gilrs.
gamepad = ["dep:gilrs"]
# GTK4/libadwaita user interface (console picker, stream page with overlay).
gui = ["dep:gtk", "dep:adw", "dep:gst-plugin-gtk4"]

[dependencies]
anyhow = "1"
thiserror = "2"
clap = { version = "4.5", features = ["derive", "env"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "signal"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
directories = "6"
url = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
futures = "0.3"
qrcode = { version = "0.14", default-features = false }

gst = { package = "gstreamer", version = "0.23", features = ["v1_22"] }
gst-webrtc = { package = "gstreamer-webrtc", version = "0.23", features = ["v1_22"] }
gst-sdp = { package = "gstreamer-sdp", version = "0.23", features = ["v1_22"] }
gst-rtp = { package = "gstreamer-rtp", version = "0.23", features = ["v1_22"] }
gst-video = { package = "gstreamer-video", version = "0.23", features = ["v1_22"] }
glib = "0.20"

gilrs = { version = "0.11", optional = true }
gtk = { package = "gtk4", version = "0.9", features = ["v4_14"], optional = true }
adw = { package = "libadwaita", version = "0.7", features = ["v1_5"], optional = true }
gst-plugin-gtk4 = { version = "0.13", features = ["dmabuf", "wayland", "x11egl", "gtk_v4_14"], optional = true }

[dev-dependencies]
pretty_assertions = "1"

[profile.release]
lto = "thin"
